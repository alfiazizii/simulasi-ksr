        }

        }

        const EXAM_DURATION = 20 * 60; // 20 Menit

        const [examStage, setExamStage] = React.useState("intro"); // 'intro', 'testing', 'result', 'review'
        const [currentQIndex, setCurrentQIndex] = React.useState(0);
        const [answers, setAnswers] = React.useState({});
        const [doubtful, setDoubtful] = React.useState({});
        const [timeLeft, setTimeLeft] = React.useState(EXAM_DURATION);
        const [showSubmitModal, setShowSubmitModal] = React.useState(false);
        const [reviewFilter, setReviewFilter] = React.useState("all"); // 'all', 'wrong', 'doubt'

        // Countdown timer handler
        React.useEffect(() => {
          let timer = null;
          if (examStage === "testing" && timeLeft > 0) {
            timer = setInterval(() => {
              setTimeLeft((prev) => prev - 1);
            }, 1000);
          } else if (timeLeft === 0 && examStage === "testing") {
            setExamStage("result");
          }
          return () => clearInterval(timer);
        }, [examStage, timeLeft]);

        const startExam = () => {
          setAnswers({});
          setDoubtful({});
          setCurrentQIndex(0);
          setTimeLeft(EXAM_DURATION);
          setShowSubmitModal(false);
          setExamStage("testing");
        };

        const toggleDoubt = () => {
          setDoubtful((prev) => ({
            ...prev,
            [currentQIndex]: !prev[currentQIndex],
          }));
        };

        const selectOption = (optIdx) => {
          setAnswers((prev) => ({
            ...prev,
            [currentQIndex]: optIdx,
          }));
        };

        const formatTime = (seconds) => {
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
        };

        // Hitung skor Olimpiade (+4 Benar, -1 Salah, 0 Kosong)
        const calculateResults = () => {
          let correctCount = 0;
          let wrongCount = 0;
          let emptyCount = 0;
          let totalPoints = 0;

          const breakdown = {
            Ekonomi: { correct: 0, total: 0 },
            Sosiologi: { correct: 0, total: 0 },
            Geografi: { correct: 0, total: 0 },
            Sejarah: { correct: 0, total: 0 },
          };

          quizData.forEach((q, idx) => {
            breakdown[q.subject].total += 1;
            const ans = answers[idx];

            if (ans === undefined) {
              emptyCount += 1;
            } else if (ans === q.answer) {
              correctCount += 1;
              totalPoints += 4;
              breakdown[q.subject].correct += 1;
            } else {
              wrongCount += 1;
              totalPoints -= 1;
            }
          });

          const maxPossiblePoints = quizData.length * 4;
          const percentage = Math.max(
            0,
            Math.round((Math.max(0, totalPoints) / maxPossiblePoints) * 100),
          );

          let medal = {
            title: "Peserta Pembinaan KSR",
            subtitle: "Terus tingkatkan belajar dan bedah modul materi.",
            color: "text-slate-700",
            badgeColor: "bg-slate-100 text-slate-700 border-slate-300",
            iconColor: "text-slate-500 bg-slate-100",
          };

          if (percentage >= 85) {
            medal = {
              title: "Peraih Medali Emas (Gold Medalist)",
              subtitle:
                "Luar Biasa! Kemampuan penalaran dan konsep IPS kamu sangat matang!",
              color: "text-amber-700",
              badgeColor: "bg-amber-100 text-amber-800 border-amber-300",
              iconColor: "text-amber-500 bg-amber-50",
            };
          } else if (percentage >= 70) {
            medal = {
              title: "Peraih Medali Perak (Silver Medalist)",
              subtitle:
                "Sangat Bagus! Sedikit evaluasi lagi menuju podium juara utama.",
              color: "text-slate-800",
              badgeColor: "bg-slate-200 text-slate-800 border-slate-400",
              iconColor: "text-slate-600 bg-slate-100",
            };
          } else if (percentage >= 50) {
            medal = {
              title: "Peraih Medali Perunggu (Bronze Medalist)",
              subtitle:
                "Bagus! Kamu memiliki pondasi pemahaman materi yang cukup baik.",
              color: "text-orange-800",
              badgeColor: "bg-orange-100 text-orange-800 border-orange-300",
              iconColor: "text-orange-500 bg-orange-50",
            };
          }

          return {
            correctCount,
            wrongCount,
            emptyCount,
            totalPoints,
            maxPossiblePoints,
            percentage,
            breakdown,
            medal,
          };
        };

        if (examStage === "intro") {
          return (

                  <Icons.Trophy /> Mulai Ujian CBT Sekarang
                </button>
              </div>
            </div>
          );

          const isSelected = answers[currentQIndex] !== undefined;
          const isDoubt = !!doubtful[currentQIndex];

                <div className="flex items-center gap-2">
                  <span className="font-bold text-sm md:text-base text-slate-800">
                    Soal No. {currentQIndex + 1}
                  </span>
                  <span
                    className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${
                      currentQ.subject === "Ekonomi"
                        ? "bg-blue-100 text-blue-700"
                        : currentQ.subject === "Sosiologi"
                          ? "bg-purple-100 text-purple-700"
                          : currentQ.subject === "Geografi"
                            ? "bg-emerald-100 text-emerald-700"

                  >
                    {currentQ.subject}
                  </span>
                </div>

                <div className="flex items-center gap-2">
                  <div
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-mono text-xs md:text-sm font-bold border ${
                      timeLeft < 180

                    <Icons.Clock />
                    <span>{formatTime(timeLeft)}</span>
                  </div>

                  <button
                    onClick={() => setShowSubmitModal(true)}
                    className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow-sm"
                  >
                    Selesai Ujian
                  </button>
                </div>
              </div>

              {/* Workspace Grid */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1">
                {/* Question Card (8 cols) */}
                <div className="lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-5 md:p-6 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                      <span className="text-xs text-slate-500">
                        Pilihlah salah satu jawaban yang paling tepat
                      </span>
                      <button
                        onClick={toggleDoubt}
                        className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded-lg border transition ${
                          isDoubt
                            ? "bg-amber-400 border-amber-500 text-slate-900 shadow-sm"
                            : "bg-white border-slate-300 text-slate-600 hover:bg-slate-50"
                        }`}
                      >
                        <Icons.Alert />
                        {isDoubt ? "Ragu-Ragu (Ditandai)" : "Tandai Ragu-Ragu"}
                      </button>
                    </div>

                    <h3 className="text-sm md:text-base font-medium text-slate-800 leading-relaxed mb-6">
                      {currentQ.q}
                    </h3>

                    <div className="space-y-3 mb-6">
                      {currentQ.options.map((opt, optIdx) => {
                        const isThisSelected =
                          answers[currentQIndex] === optIdx;
                        return (
                          <button
                            key={optIdx}
                            onClick={() => selectOption(optIdx)}
                            className={`w-full text-left p-3.5 md:p-4 rounded-xl border text-xs md:text-sm font-medium transition flex items-start gap-3 ${
                              isThisSelected
                                ? "border-orange-500 bg-orange-50/70 text-orange-950 shadow-sm ring-1 ring-orange-400"
                                : "border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700 bg-white"
                            }`}
                          >
                            <span
                              className={`w-6 h-6 flex-shrink-0 rounded-lg flex items-center justify-center font-bold text-xs ${
                                isThisSelected
                                  ? "bg-orange-500 text-white"
                                  : "bg-slate-100 text-slate-600"
                              }`}
                            >
                              {String.fromCharCode(65 + optIdx)}
                            </span>
                            <span className="pt-0.5 leading-relaxed">
                              {opt}
                            </span>
                          </button>
                        );
                      })}

                  </div>

                  <div className="flex items-center justify-between pt-4 border-t border-slate-100">

                      disabled={currentQIndex === 0}
                      onClick={() => setCurrentQIndex(currentQIndex - 1)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold border border-slate-300 text-slate-600 hover:bg-slate-50 disabled:opacity-40 transition"

                    </button>

                    {currentQIndex === quizData.length - 1 ? (
                      <button
                        onClick={() => setShowSubmitModal(true)}
                        className="px-5 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-sm"

                        Kumpulkan Ujian
                      </button>
                    ) : (
                      <button
                        onClick={() => setCurrentQIndex(currentQIndex + 1)}
                        className="px-4 py-2 rounded-xl text-xs font-semibold bg-orange-500 hover:bg-orange-600 text-white transition shadow-sm"
                      >
                        Selanjutnya →
                      </button>
                    )}
                  </div>
                </div>

                <div className="lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between">
                  <div>
                    <h4 className="font-bold text-xs uppercase tracking-wider text-slate-500 mb-3 pb-2 border-b border-slate-100">
                      Kisi Navigasi Nomor Soal
                    </h4>

                    <div className="grid grid-cols-5 gap-2 mb-4">
                      {quizData.map((q, idx) => {
                        const answered = answers[idx] !== undefined;
                        const isDoubtItem = !!doubtful[idx];
                        const isCurrent = currentQIndex === idx;

                        let colorClass =
                          "bg-slate-100 border-slate-200 text-slate-600";
                        if (isDoubtItem) {
                          colorClass =
                            "bg-amber-400 border-amber-500 text-slate-900 font-bold";
                        } else if (answered) {
                          colorClass =
                            "bg-emerald-600 border-emerald-700 text-white font-bold";
                        }

                        return (
                          <button
                            key={idx}
                            onClick={() => setCurrentQIndex(idx)}
                            className={`h-9 rounded-xl border text-xs font-semibold transition flex items-center justify-center relative ${colorClass} ${
                              isCurrent
                                ? "ring-2 ring-orange-500 ring-offset-2"
                                : ""
                            }`}
                          >
                            {idx + 1}
                          </button>
                        );
                      })}

                    {/* Legends */}
                    <div className="space-y-1.5 text-[11px] text-slate-600 border-t border-slate-100 pt-3">

                        </div>
                        <span className="font-bold text-slate-800">
                          {answeredCount}
                        </span>
                      </div>
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <span className="w-3 h-3 rounded bg-amber-400"></span>
                          <span>Ragu-Ragu</span>
                        </div>
                        <span className="font-bold text-slate-800">
                          {doubtCount}
                        </span>
                      </div>
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <span className="w-3 h-3 rounded bg-slate-200"></span>
                          <span>Belum Dijawab</span>
                        </div>
                        <span className="font-bold text-slate-800">
                          {emptyCount}
                        </span>
                      </div>
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-100 mt-4">
                    <button
                      onClick={() => setShowSubmitModal(true)}
                      className="w-full py-2.5 rounded-xl border border-emerald-500 text-emerald-700 bg-emerald-50 hover:bg-emerald-100 text-xs font-bold transition"
                    >
                      Kumpul Jawaban Sekarang
                    </button>
                  </div>
                </div>
              </div>

              {/* Confirmation Modal */}
              {showSubmitModal && (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 animate-fade-in">
                    <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-3">
                      <Icons.Check />
                    </div>
                    <h3 className="text-lg font-bold text-slate-800 mb-2">
                      Kumpulkan Ujian KSR?
                    </h3>
                    <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                      Pastikan seluruh jawaban telah Anda periksa. Soal yang
                      belum dijawab bernilai 0 dan jawaban salah terkena penalti
                      -1.
                    </p>

                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-5 text-xs space-y-1 text-slate-700">
                      <div className="flex justify-between">
                        <span>Terjawab:</span>
                        <span className="font-bold text-emerald-600">
                          {answeredCount} soal
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Ragu-ragu:</span>
                        <span className="font-bold text-amber-600">
                          {doubtCount} soal
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Belum dijawab:</span>
                        <span className="font-bold text-rose-600">
                          {emptyCount} soal
                        </span>
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <button
                        onClick={() => setShowSubmitModal(false)}
                        className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-xs hover:bg-slate-50"
                      >
                        Periksa Kembali
                      </button>
                      <button
                        onClick={() => {
                          setShowSubmitModal(false);
                          setExamStage("result");
                        }}
                        className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm"
                      >
                        Ya, Kumpulkan
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        if (examStage === "result") {
          const results = calculateResults();

          return (
            <div className="p-4 md:p-8 animate-fade-in max-w-4xl mx-auto space-y-6 pb-24 md:pb-8">
              {/* Medal & Main Card */}
              <div className="bg-white rounded-2xl border border-slate-200 p-6 md:p-8 text-center shadow-sm relative overflow-hidden">
                <div className="inline-flex p-4 rounded-2xl bg-amber-50 text-amber-500 mb-3">
                  <Icons.Trophy />
                </div>
                <span className="block text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-1">

                </span>
                <h2
                  className={`text-2xl md:text-3xl font-black mb-1 ${results.medal.color}`}
                >
                  {results.medal.title}
                </h2>
                <p className="text-xs md:text-sm text-slate-500 max-w-md mx-auto mb-6">
                  {results.medal.subtitle}
                </p>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-2xl mx-auto mb-6">
                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">

                    </span>
                    <span className="text-xl font-black text-slate-800">
                      {results.totalPoints}{" "}
                      <span className="text-xs font-normal text-slate-400">
                        / {results.maxPossiblePoints}
                      </span>
                    </span>
                  </div>
                  <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200">
                    <span className="text-[11px] text-emerald-600 block mb-0.5">
                      Benar (+4)
                    </span>
                    <span className="text-xl font-black text-emerald-700">
                      {results.correctCount}{" "}
                      <span className="text-xs font-normal">Soal</span>
                    </span>
                  </div>
                  <div className="p-3 bg-rose-50 rounded-xl border border-rose-200">
                    <span className="text-[11px] text-rose-600 block mb-0.5">
                      Salah (-1)
                    </span>
                    <span className="text-xl font-black text-rose-700">
                      {results.wrongCount}{" "}
                      <span className="text-xs font-normal">Soal</span>
                    </span>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <span className="text-[11px] text-slate-500 block mb-0.5">
                      Kosong (0)
                    </span>
                    <span className="text-xl font-black text-slate-700">
                      {results.emptyCount}{" "}
                      <span className="text-xs font-normal">Soal</span>
                    </span>
                  </div>
                </div>

                {/* Action Buttons */}
                <div className="flex flex-wrap items-center justify-center gap-3">
                  <button
                    onClick={() => setExamStage("review")}
                    className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs md:text-sm flex items-center gap-2 shadow-sm"
                  >
                    <Icons.Eye /> Lihat Kunci & Pembahasan Konsep
                  </button>
                  <button
                    onClick={startExam}
                    className="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 font-semibold text-xs md:text-sm flex items-center gap-2 transition"
                  >
                    <Icons.Rotate /> Ulangi Simulasi Ujian
                  </button>
                </div>
              </div>

              {/* Subject Diagnostics Analytics */}
              <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <div className="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100 font-bold text-slate-800 text-sm md:text-base">
                  <Icons.BarChart />
                  <span>Diagnostik Performa Berdasarkan Mata Pelajaran</span>
                </div>

                <div className="grid md:grid-cols-2 gap-4">
                  {Object.entries(results.breakdown).map(([subject, stat]) => {
                    const percentage = Math.round(
                      (stat.correct / stat.total) * 100,
                    );
                    const isWeak = percentage < 60;

                    return (
                      <div
                        key={subject}
                        className="p-4 rounded-xl border border-slate-200 bg-slate-50/50 flex flex-col justify-between"
                      >
                        <div>
                          <div className="flex justify-between items-center text-xs font-bold mb-2">
                            <span className="text-slate-800">{subject}</span>
                            <span
                              className={
                                isWeak ? "text-rose-600" : "text-emerald-600"
                              }
                            >
                              {stat.correct} / {stat.total} Benar ({percentage}
                              %)
                            </span>
                          </div>

                          <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden mb-3">
                            <div
                              className={`h-full rounded-full transition-all duration-500 ${
                                isWeak ? "bg-rose-500" : "bg-emerald-500"
                              }`}
                              style={{ width: `${percentage}%` }}
                            ></div>
                          </div>
                        </div>

                        {isWeak ? (
                          <div className="pt-2 border-t border-slate-200/60 flex items-center justify-between text-[11px] text-rose-600">
                            <span>⚠️ Perlu remedial materi</span>
                            <button
                              onClick={() =>
                                navigateToModule(subject.toLowerCase())
                              }
                              className="font-bold underline hover:text-rose-800"
                            >
                              Buka Modul {subject} →
                            </button>
                          </div>
                        ) : (
                          <div className="pt-2 border-t border-slate-200/60 text-[11px] text-emerald-600 flex items-center gap-1 font-semibold">
                            <Icons.Check /> Penguasaan konsep sangat baik
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        if (examStage === "review") {
          const filteredQuestions = quizData
            .map((q, idx) => ({ ...q, originalIndex: idx }))
            .filter((item) => {
              const userAns = answers[item.originalIndex];
              if (reviewFilter === "wrong") return userAns !== item.answer;
              if (reviewFilter === "doubt")
                return !!doubtful[item.originalIndex];
              return true;
            });

          return (
            <div className="p-4 md:p-8 animate-fade-in max-w-3xl mx-auto space-y-4 pb-24 md:pb-8">
              {/* Header Review */}
              <div className="bg-white p-4 md:p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h2 className="font-bold text-slate-800 text-sm md:text-base">
                    Kunci Jawaban & Pembahasan Mendalam
                  </h2>
                  <p className="text-xs text-slate-500">
                    Evaluasi penalaran ilmiah dari Guru IPS
                  </p>
                </div>

                <button
                  onClick={() => setExamStage("result")}
                  className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition w-max"
                >
                  ← Kembali ke Ringkasan
                </button>
              </div>

              {/* Filter Tabs */}
              <div className="flex gap-2">
                <button
                  onClick={() => setReviewFilter("all")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${
                    reviewFilter === "all"
                      ? "bg-indigo-600 text-white"
                      : "bg-white border text-slate-600"
                  }`}
                >
                  Semua Soal ({quizData.length})
                </button>
                <button
                  onClick={() => setReviewFilter("wrong")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${
                    reviewFilter === "wrong"
                      ? "bg-rose-600 text-white"
                      : "bg-white border text-slate-600"
                  }`}
                >
                  Jawaban Salah / Kosong
                </button>
                <button
                  onClick={() => setReviewFilter("doubt")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${
                    reviewFilter === "doubt"
                      ? "bg-amber-500 text-white"
                      : "bg-white border text-slate-600"
                  }`}
                >
                  Ditandai Ragu
                </button>
              </div>

              {/* Question List */}
              <div className="space-y-4">
                {filteredQuestions.map((q) => {
                  const userAns = answers[q.originalIndex];
                  const isCorrect = userAns === q.answer;
                  const isEmpty = userAns === undefined;

                  return (
                    <div
                      key={q.id}
                      className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3"
                    >
                      <div className="flex items-center justify-between text-xs">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-800">
                            Nomor {q.originalIndex + 1}
                          </span>
                          <span className="px-2 py-0.5 rounded-md bg-slate-100 font-semibold text-slate-600">
                            {q.subject}
                          </span>
                        </div>
                        <span
                          className={`font-bold px-2.5 py-0.5 rounded-full ${
                            isEmpty
                              ? "bg-slate-100 text-slate-600"
                              : isCorrect
                                ? "bg-emerald-100 text-emerald-700"
                                : "bg-rose-100 text-rose-700"
                          }`}
                        >
                          {isEmpty
                            ? "Kosong (0)"
                            : isCorrect
                              ? "Benar (+4)"
                              : "Salah (-1)"}
                        </span>
                      </div>

                      <p className="text-slate-800 text-xs md:text-sm font-medium leading-relaxed">
                        {q.q}
                      </p>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs pt-1">
                        {q.options.map((opt, oIdx) => {
                          const isKey = oIdx === q.answer;
                          const isChosen = oIdx === userAns;

                          let style =
                            "border-slate-200 bg-slate-50/70 text-slate-600";
                          if (isKey) {
                            style =
                              "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold ring-1 ring-emerald-400";
                          } else if (isChosen && !isCorrect) {
                            style =
                              "border-rose-400 bg-rose-50 text-rose-900 font-semibold";
                          }

                          return (
                            <div
                              key={oIdx}
                              className={`p-2.5 rounded-xl border flex items-center gap-2.5 ${style}`}
                            >
                              <span className="w-5 h-5 flex-shrink-0 flex items-center justify-center rounded-lg bg-white text-[11px] font-bold border border-inherit">
                                {String.fromCharCode(65 + oIdx)}
                              </span>
                              <span className="leading-snug">{opt}</span>
                            </div>
                          );
                        })}
                      </div>

                      {/* Teacher's Conceptual Explanation */}
                      <div className="bg-indigo-50/70 rounded-xl p-3.5 border border-indigo-100 text-xs text-indigo-950 mt-3">
                        <div className="font-bold flex items-center gap-1.5 text-indigo-700 mb-1">
                          <Icons.Help /> Pembahasan Konsep Guru:
                        </div>
                        <p className="leading-relaxed">{q.explanation}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        return null;
      };

      const App = () => {
        const [currentTab, setCurrentTab] = React.useState("home");
        const [targetModule, setTargetModule] = React.useState("ekonomi");

        const handleNavigateToModule = (subjectKey) => {
          setTargetModule(subjectKey);
          setCurrentTab("modules");
        };

        const renderContent = () => {
          switch (currentTab) {
            case "home":
              return <HomeScreen navigateTo={setCurrentTab} />;
            case "modules":
              return <ModulesScreen defaultSubject={targetModule} />;
            case "chat":
              return <ChatScreen />;
            case "quiz":
              return <QuizScreen navigateToModule={handleNavigateToModule} />;
            default:
              return <HomeScreen navigateTo={setCurrentTab} />;
          }
        };

        const NavButton = ({ tab, icon: Icon, label }) => {
          const isActive = currentTab === tab;
          return (
            <button
              onClick={() => setCurrentTab(tab)}
              className={`flex flex-col items-center justify-center w-full py-2 ${
                isActive
                  ? "text-blue-600 font-bold"
                  : "text-slate-500 hover:text-slate-800"
              }`}
            >
              <div
                className={`mb-1 transition-transform ${isActive ? "scale-110" : ""}`}
              >
                <Icon />
              </div>
              <span className="text-[10px]">{label}</span>
            </button>
          );
        };

        return (
          <div className="min-h-screen flex flex-col bg-slate-100">
            {/* Header Desktop */}
            <header className="hidden md:flex bg-white shadow-sm px-6 py-3.5 items-center justify-between z-20 border-b border-slate-200">
              <div
                className="font-extrabold text-xl text-slate-800 flex items-center gap-2 cursor-pointer"
                onClick={() => setCurrentTab("home")}
              >
                <div className="bg-blue-600 text-white px-2 py-0.5 rounded-lg text-sm font-black">
                  KSR
                </div>
                <span>IPS Pro</span>
              </div>
              <nav className="flex items-center gap-1.5">
                <button
                  onClick={() => setCurrentTab("home")}
                  className={`px-4 py-2 rounded-xl font-semibold text-xs transition ${
                    currentTab === "home"
                      ? "bg-blue-50 text-blue-600"
                      : "text-slate-600 hover:bg-slate-50"
                  }`}
                >
                  Home
                </button>
                <button
                  onClick={() => setCurrentTab("modules")}
                  className={`px-4 py-2 rounded-xl font-semibold text-xs transition ${
                    currentTab === "modules"
                      ? "bg-blue-50 text-blue-600"
                      : "text-slate-600 hover:bg-slate-50"
                  }`}
                >
                  Modul Kisi-Kisi
                </button>
                <button
                  onClick={() => setCurrentTab("chat")}
                  className={`px-4 py-2 rounded-xl font-semibold text-xs transition ${
                    currentTab === "chat"
                      ? "bg-blue-50 text-blue-600"
                      : "text-slate-600 hover:bg-slate-50"
                  }`}
                >
                  Tanya Guru
                </button>
                <button
                  onClick={() => setCurrentTab("quiz")}
                  className={`px-4 py-2 rounded-xl font-bold text-xs transition flex items-center gap-1.5 ${
                    currentTab === "quiz"
                      ? "bg-orange-500 text-white shadow-sm"
                      : "bg-orange-50 text-orange-600 hover:bg-orange-100"
                  }`}
                >
                  <Icons.Trophy /> Simulasi CBT
                </button>
              </nav>
            </header>

            <main className="flex-1 overflow-y-auto">{renderContent()}</main>

            {/* Bottom Navigation Mobile */}
            <nav className="md:hidden bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 z-30 pb-safe shadow-lg">
              <div className="flex justify-around items-center h-16">
                <NavButton tab="home" icon={Icons.Home} label="Home" />
                <NavButton tab="modules" icon={Icons.Book} label="Modul" />
                <NavButton tab="chat" icon={Icons.Message} label="Tanya Guru" />
                <NavButton tab="quiz" icon={Icons.Trophy} label="CBT KSR" />
              </div>
            </nav>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
